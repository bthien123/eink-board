<!DOCTYPE html>
<html lang="vi">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<title>E-ink Board</title>
<style>
  @font-face { font-family: 'Cozette';     src: url('fonts/CozetteVector.ttf') format('truetype'); font-display: block; }
  @font-face { font-family: 'CozetteBold'; src: url('fonts/CozetteVectorBold.ttf') format('truetype'); font-display: block; }

  :root {
    --bg: #f5f5f4; --card: #fff; --ink: #1c1917; --muted: #78716c;
    --line: #e7e5e4; --ok: #16a34a;
  }
  @media (prefers-color-scheme: dark) {
    :root { --bg: #1c1917; --card: #292524; --ink: #f5f5f4; --muted: #a8a29e; --line: #44403c; }
  }
  * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
  body {
    margin: 0; padding: 16px; background: var(--bg); color: var(--ink);
    font: 16px/1.5 -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
    padding-bottom: calc(16px + env(safe-area-inset-bottom));
  }
  h1 { font-size: 20px; margin: 0 0 4px; }
  .sub { color: var(--muted); font-size: 14px; margin-bottom: 16px; }
  .card { background: var(--card); border: 1px solid var(--line); border-radius: 14px; padding: 14px; margin-bottom: 12px; }
  button {
    width: 100%; padding: 15px; font-size: 17px; font-weight: 600;
    border: 0; border-radius: 12px; background: var(--ink); color: var(--bg);
    margin-bottom: 8px; cursor: pointer;
  }
  button.secondary { background: transparent; color: var(--ink); border: 1.5px solid var(--line); }
  button:disabled { opacity: .4; }
  label { display: block; font-size: 13px; color: var(--muted); margin: 8px 0 4px; }
  input, select {
    width: 100%; padding: 11px; font-size: 16px; border-radius: 10px;
    border: 1.5px solid var(--line); background: var(--card); color: var(--ink);
  }
  #status { font-size: 14px; color: var(--muted); }
  #status.on { color: var(--ok); font-weight: 600; }
  dl { display: grid; grid-template-columns: auto 1fr; gap: 4px 12px; margin: 0; font-size: 14px; }
  dt { color: var(--muted); }
  dd { margin: 0; font-family: ui-monospace, Menlo, monospace; word-break: break-all; }
  canvas { width: 100%; image-rendering: pixelated; border: 1px solid var(--line); border-radius: 6px; background: #fff; }
  #log { font: 12px/1.45 ui-monospace, Menlo, monospace; white-space: pre-wrap;
         max-height: 190px; overflow-y: auto; color: var(--muted); }
  .warn { background: #fef3c7; color: #78350f; border-radius: 10px; padding: 10px 12px; font-size: 14px; }
</style>
</head>
<body>

<h1>E-ink Board</h1>
<div class="sub">Điều khiển màn e-ink 2.9" qua Bluetooth</div>

<div id="unsupported" class="card warn" hidden>
  Trình duyệt này không hỗ trợ Web Bluetooth. Trên iPhone hãy mở bằng
  <b>Bluefy</b>; trên máy tính dùng Chrome hoặc Edge.
</div>

<div class="card">
  <button id="btnConnect">Kết nối</button>
  <div id="status">Chưa kết nối</div>
</div>

<div class="card" id="infoCard" hidden>
  <dl>
    <dt>Thiết bị</dt><dd id="iName">–</dd>
    <dt>Firmware</dt><dd id="iVer">–</dd>
    <dt>MTU</dt><dd id="iMtu">–</dd>
    <dt>Config</dt><dd id="iCfg">–</dd>
  </dl>
</div>

<div class="card">
  <div class="sub" style="margin:0 0 8px">Xem trước (đúng những gì màn sẽ hiện)</div>
  <canvas id="preview" width="296" height="138"></canvas>
  <label for="daySel">Ngày (dữ liệu mẫu)</label>
  <select id="daySel"></select>
  <label for="owner">Tên hiện trên banner — lưu trên máy này, không gửi đi đâu</label>
  <input id="owner" placeholder="ví dụ: BÙI NHẬT MINH" autocapitalize="characters">
</div>

<div class="card">
  <button id="btnSend" disabled>Gửi lên màn</button>
  <button id="btnClear" class="secondary" disabled>Xoá trắng</button>
</div>

<div class="card"><div id="log"></div></div>

<script src="sample.js"></script>
<script src="layout.js"></script>
<script>
// No names, no calendar ids in here: this repo is public for GitHub Pages, so
// anything personal lives in the phone's localStorage instead.
const NAME_PREFIX = 'NRF';   // every board of this kind advertises as NRF_EPD_xxxx
const UUID_SVC  = '62750001-d828-918d-fb46-b6c11c675aec';
const UUID_CHAR = '62750002-d828-918d-fb46-b6c11c675aec';
const UUID_VER  = '62750003-d828-918d-fb46-b6c11c675aec';

const CMD = { INIT:0x01, SEND_CMD:0x03, SEND_DATA:0x04, REFRESH:0x05, SLEEP:0x06 };

// SSD16xx registers we drive directly, because the firmware's model table has
// no entry for a panel this size.
const SSD = { GDO_CTRL:0x01, ENTRY_MODE:0x11, TSENSOR:0x18,
              WRITE_RAM_BW:0x24, WRITE_RAM_RED:0x26, BORDER:0x3C,
              RAM_XPOS:0x44, RAM_YPOS:0x45, AUTO_RED:0x46, AUTO_BW:0x47,
              RAM_XCOUNT:0x4E, RAM_YCOUNT:0x4F };
const SHIM_MODEL = 0x02;   // any SSD16xx model: we only want its reset + refresh
const AUTO_WHITE = 0xF7;

const $ = id => document.getElementById(id);
const sleep = ms => new Promise(r => setTimeout(r, ms));

function log(msg) {
  const el = $('log');
  el.textContent += `${new Date().toTimeString().slice(0, 8)}  ${msg}\n`;
  el.scrollTop = el.scrollHeight;
}

// ---------------------------------------------------------------- BLE device
const dev = { device:null, char:null, mtu:20, msgs:0, version:null };

async function connect() {
  // Filter by name, not by service uuid: with more than one board around, the
  // chooser should list them all so you can pick. The service still has to be
  // declared optional or we would not be allowed to reach it after connecting.
  dev.device = await navigator.bluetooth.requestDevice({
    filters: [{ namePrefix: NAME_PREFIX }], optionalServices: [UUID_SVC],
  });
  dev.device.addEventListener('gattserverdisconnected', () => {
    log('Mất kết nối.'); setConnected(false);
  });
  const name = dev.device.name || '(không tên)';
  log('Đang kết nối ' + name);
  localStorage.setItem(lastDeviceKey, name);

  const svc = await (await dev.device.gatt.connect()).getPrimaryService(UUID_SVC);
  dev.char = await svc.getCharacteristic(UUID_CHAR);
  try {
    dev.version = (await (await svc.getCharacteristic(UUID_VER)).readValue()).getUint8(0);
  } catch (e) { log('Không đọc được version: ' + e.message); }

  dev.msgs = 0;
  await dev.char.startNotifications();
  dev.char.addEventListener('characteristicvaluechanged', onNotify);

  // The firmware only reports its real MTU in reply to an INIT, and the first
  // notification after subscribing carries the whole stored config.
  await write(CMD.INIT, [SHIM_MODEL]);
  await sleep(600);

  $('iName').textContent = dev.device.name || '(không tên)';
  $('iVer').textContent = dev.version != null ? '0x' + dev.version.toString(16) : '–';
  $('infoCard').hidden = false;
  setConnected(true);
}

function onNotify(ev) {
  const data = new Uint8Array(ev.target.value.buffer);
  if (dev.msgs++ === 0) {
    $('iCfg').textContent = [...data].map(b => b.toString(16).padStart(2, '0')).join('');
    return;
  }
  const msg = new TextDecoder().decode(data);
  log('← ' + msg);
  const m = msg.match(/mtu=(\d+)/);
  if (m) { dev.mtu = +m[1]; $('iMtu').textContent = dev.mtu + ' byte/gói'; }
}

function setConnected(on) {
  $('status').textContent = on ? 'Đã kết nối' : 'Chưa kết nối';
  $('status').className = on ? 'on' : '';
  $('btnConnect').textContent = on ? 'Ngắt kết nối' : 'Kết nối';
  $('btnSend').disabled = !on;
  $('btnClear').disabled = !on;
}

async function write(cmd, bytes = []) {
  const payload = Uint8Array.from([cmd, ...bytes]);
  if (dev.char.writeValueWithResponse) await dev.char.writeValueWithResponse(payload);
  else await dev.char.writeValue(payload);
}

async function epdCmd(reg, ...params) {
  await write(CMD.SEND_CMD, [reg]);
  if (params.length) await epdData(Uint8Array.from(params));
}

async function epdData(bytes) {
  const chunk = Math.max(1, dev.mtu - 1);
  for (let i = 0; i < bytes.length; i += chunk) await write(CMD.SEND_DATA, bytes.subarray(i, i + chunk));
}

async function sendPlanes(black, red) {
  await write(CMD.INIT, [SHIM_MODEL]);          // hardware reset via the firmware
  await sleep(600);

  // A refresh pushes the WHOLE RAM to the glass, not just the window we wrote,
  // so anything outside it would still show the firmware's old pixels.
  await epdCmd(SSD.AUTO_RED, AUTO_WHITE); await sleep(2000);
  await epdCmd(SSD.AUTO_BW,  AUTO_WHITE); await sleep(2000);

  const w = PANEL.RAM_W, h = PANEL.RAM_H;
  await epdCmd(SSD.GDO_CTRL, (h - 1) & 0xFF, (h - 1) >> 8, 0x00);
  await epdCmd(SSD.ENTRY_MODE, 0x03);
  await epdCmd(SSD.RAM_XPOS, 0x00, (w / 8) - 1);
  await epdCmd(SSD.RAM_YPOS, 0x00, 0x00, (h - 1) & 0xFF, (h - 1) >> 8);
  await epdCmd(SSD.BORDER, 0x05);
  await epdCmd(SSD.TSENSOR, 0x80);

  for (const [reg, data] of [[SSD.WRITE_RAM_BW, black], [SSD.WRITE_RAM_RED, red]]) {
    await epdCmd(SSD.RAM_XCOUNT, 0x00);
    await epdCmd(SSD.RAM_YCOUNT, 0x00, 0x00);
    await epdCmd(reg);
    await epdData(data);
  }

  log('Đang refresh, chờ ~25 giây…');
  await write(CMD.REFRESH);                     // firmware waits on BUSY for us
  await sleep(25000);
  await write(CMD.SLEEP);
  log('Xong.');
}

// ---------------------------------------------------------------- UI wiring
const ownerKey = 'eink.owner';
const lastDeviceKey = 'eink.lastDevice';
let current = null;

function render() {
  const day = SAMPLE_WEEK[+$('daySel').value];
  current = drawDay(day, $('owner').value.trim());
  paintPreview($('preview'), current.B, current.R);
}

$('daySel').innerHTML = SAMPLE_WEEK
  .map((d, i) => `<option value="${i}">${d.weekday_vi} ${d.date}</option>`).join('');
$('owner').value = localStorage.getItem(ownerKey) || '';
$('daySel').onchange = render;
$('owner').oninput = () => { localStorage.setItem(ownerKey, $('owner').value); render(); };

$('btnConnect').onclick = async () => {
  if (dev.device && dev.device.gatt.connected) { dev.device.gatt.disconnect(); return; }
  try { await connect(); } catch (e) { log('Lỗi kết nối: ' + e.message); }
};

$('btnSend').onclick = async () => {
  const b = $('btnSend'); b.disabled = true;
  try {
    const { black, red } = planesFrom(current.B, current.R);
    log(`Gửi ${black.length} byte mỗi plane, ${dev.mtu} byte/gói…`);
    await sendPlanes(black, red);
  } catch (e) { log('Lỗi: ' + e.message); }
  b.disabled = false;
};

$('btnClear').onclick = async () => {
  const b = $('btnClear'); b.disabled = true;
  try {
    const n = (PANEL.RAM_W / 8) * PANEL.RAM_H;
    await sendPlanes(new Uint8Array(n).fill(0xFF), new Uint8Array(n).fill(0xFF));
  } catch (e) { log('Lỗi: ' + e.message); }
  b.disabled = false;
};

if (!navigator.bluetooth) $('unsupported').hidden = false;
const lastDevice = localStorage.getItem(lastDeviceKey);
if (lastDevice) log('Lần trước dùng: ' + lastDevice);

// The pixel font must be loaded before anything is measured: falling back to a
// system face would give different ink boxes and a different layout.
Promise.all([
  document.fonts.load(`13px ${FONT}`),
  document.fonts.load(`13px ${FONT_BOLD}`),
]).then(() => { render(); log('Sẵn sàng. Bấm Kết nối.'); })
  .catch(e => log('Không tải được font: ' + e.message));
</script>
</body>
</html>
